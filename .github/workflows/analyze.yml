name: Analyze

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  consumer-basic:
    name: Consumer (basic)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build package tarball
        run: |
          bun install --frozen-lockfile
          bun run build
          bun pm pack

      - name: Install as a consumer
        run: |
          mkdir "$HOME/consumer" && cd "$HOME/consumer"
          echo '{"name":"consumer","private":true}' > package.json
          echo '{"compilerOptions":{"experimentalDecorators":true}}' > tsconfig.json
          TGZ=$(ls "$GITHUB_WORKSPACE"/inversify-socket-utils-*.tgz)
          bun add "$TGZ" inversify@^7 reflect-metadata socket.io socket.io-client
          cp -r "$GITHUB_WORKSPACE/examples" .

      - name: Resolve package entries like a consumer
        run: |
          cd "$HOME/consumer"
          node -e "const m = require('inversify-socket-utils'); if (typeof m.InversifySocketServer !== 'function') { throw new Error('require() entry is broken'); }"
          bun -e "const m = await import('inversify-socket-utils'); if (typeof m.InversifySocketServer !== 'function') { throw new Error('import entry is broken'); }"

      - name: End-to-end check
        run: |
          cd "$HOME/consumer"
          bun run examples/basic/server.ts > server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if grep -q "Server is listening" server.log 2>/dev/null; then break; fi
            sleep 1
          done
          set +e
          bun run examples/basic/client.ts
          CLIENT_EXIT=$?
          set -e
          sleep 1
          cat server.log
          kill $SERVER_PID
          grep -q "client connected" server.log
          grep -q "message received" server.log
          grep -q "client disconnected" server.log
          exit $CLIENT_EXIT

  consumer-express:
    name: Consumer (express)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build package tarball
        run: |
          bun install --frozen-lockfile
          bun run build
          bun pm pack

      - name: Install as a consumer
        run: |
          mkdir "$HOME/consumer" && cd "$HOME/consumer"
          echo '{"name":"consumer","private":true}' > package.json
          echo '{"compilerOptions":{"experimentalDecorators":true,"emitDecoratorMetadata":true}}' > tsconfig.json
          TGZ=$(ls "$GITHUB_WORKSPACE"/inversify-socket-utils-*.tgz)
          bun add "$TGZ" inversify@^8 reflect-metadata socket.io socket.io-client @inversifyjs/http-core @inversifyjs/http-express express
          cp -r "$GITHUB_WORKSPACE/examples" .

      - name: End-to-end check
        run: |
          cd "$HOME/consumer"
          bun run examples/express/server.ts > server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if grep -q "HTTP is listening" server.log 2>/dev/null; then break; fi
            sleep 1
          done
          set +e
          bun run examples/express/client.ts
          CLIENT_EXIT=$?
          set -e
          sleep 1
          cat server.log
          kill $SERVER_PID
          grep -q "client connected" server.log
          grep -q "client disconnected" server.log
          exit $CLIENT_EXIT
